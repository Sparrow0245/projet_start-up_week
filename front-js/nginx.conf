server {
    listen 80;

    server_name app-levelup.fr;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
